version: 2
updates:
  # Python 依赖（pyproject.toml / uv.lock）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # GitHub Actions：钉了完整 SHA，Dependabot 负责滚动更新 SHA 与版本注释
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # CodeQL 的 init / autobuild / analyze 必须同版本，拆开会直接失败
      codeql-action:
        patterns:
          - "github/codeql-action*"
