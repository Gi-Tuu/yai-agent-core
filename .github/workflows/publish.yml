name: Publish to PyPI

# 仅在推送 v* 标签时发布。流程：
#   构建(uv build) → SLSA 构建证明(attest-build-provenance) → 校验和 +
#   cosign keyless 签名 → 创建带签名资产的 GitHub Release → 发布 PyPI(OIDC)。
#
# 为什么 Release 资产必须签名（OpenSSF Scorecard · Signed-Releases）：
#   Scorecard 只对“GitHub Release 上、资产本身带签名或 provenance”计分；
#   PyPI 的 attestation、Docker 的 provenance 都不算。因此每个 wheel/sdist/SHA256SUMS 都：
#     1) cosign sign-blob 产出同名 .sigstore（Sigstore keyless 签名束，含签名、证书与 Rekor
#        透明日志，可用 cosign verify-blob --bundle 离线验证），随 Release 上传；
#        另从该 bundle 导出传统 .sig（签名）/.pem（证书），供只认裸签名的旧式工具识别；
#     2) attest-build-provenance 生成 SLSA 构建证明（绑定资产 SHA256）。
#   .sigstore 是 Scorecard Signed-Releases 识别的签名后缀（.bundle 不被识别）；所有分发资产
#   （wheel、sdist、校验和、GitHub 自动源码包）一律统一为同名 .sigstore，避免只覆盖部分资产。
#   另附 SHA256SUMS 及其签名，供使用者核对完整性与来源。
#   此外，GitHub 自动生成的连字符源码包 yai-agent-core-<ver>.tar.gz/.zip 也单独下载并用
#   cosign 签成同名 .sigstore（含证书 + Rekor）随 Release 上传，满足 Signed-Releases 对
#   auto source archives 的同名签名件要求（wheel/sdist 的下划线名与 auto 包连字符名不同，不能互相替代）。
#
# 前置：PyPI 侧配置 Trusted Publishing 的 pending publisher
#   （Owner=Gi-Tuu, Repo=yai-agent-core, Workflow=publish.yml），见 SECURITY.md。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # 仅本任务需要提升权限：创建 Release、keyless 签名/证明、写 attestation。
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build

      # 先出 provenance：subject 只覆盖构建产物（此时尚无签名/校验和文件）。
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums and keyless signatures
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          for f in *.whl *.tar.gz SHA256SUMS; do
            cosign sign-blob "$f" \
              --bundle "$f.sigstore" \
              --yes
          done

      # .sigstore 是 Scorecard 识别的 keyless 签名束；另从 dist 顶层每个 bundle
      # 导出传统 .sig/.pem（内容来自 bundle，非空壳），供只认裸签名的旧式工具使用。
      # 仅匹配 dist 顶层（wheel/sdist/SHA256SUMS），不递归 github-archives 子目录。
      - name: Export legacy .sig/.pem from bundles
        run: |
          set -euo pipefail
          cd dist
          for b in *.sigstore; do
            base="${b%.sigstore}"
            python3 "../scripts/extract_sigstore_bundle.py" "$b" \
              --sig "$base.sig" --pem "$base.pem"
          done

      # GitHub 还会为每个 release 自动生成两个源码包，文件名是连字符的
      # yai-agent-core-<ver>.tar.gz / .zip（与 uv build 的下划线 sdist 不同）。
      # Scorecard Signed-Releases 正是按这两个 auto assets 找同名签名件；缺签名时该检查仅给低分。
      # tag 推送后 archive URL 立即可用：下载后用 cosign keyless 产完整 .sigstore
      # （bundle 内含签名证书与 Rekor 透明日志），文件名与 auto asset 精确同名 + .sigstore，
      # 只上传签名件、不重复上传源码包本体（auto asset 由 GitHub 提供）。
      - name: Sign GitHub auto source archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/github-archives
          cd dist/github-archives
          base="yai-agent-core-${TAG#v}"
          curl -fsSL -o "$base.tar.gz" "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL -o "$base.zip"      "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.zip"
          for f in "$base.tar.gz" "$base.zip"; do
            cosign sign-blob "$f" --bundle "$f.sigstore" --yes
          done

      # Release 正文优先用 docs/releases/<tag>.md（人话版：三条主线 / 升级指引 /
      # 本版数字 / 诚实边界）。没有该文件才回退到工作流从 PR 标题自动生成的流水账。
      # 此前 generate_release_notes: true 一把梭，最新一版的正文退化成了 PR 列表，
      # 仓库里精心写的人话版发布说明从未生效。
      - name: Prepare release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            echo "path=${notes}" >> "$GITHUB_OUTPUT"
            echo "release notes: using ${notes}"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "release notes: ${notes} 不存在，回退到自动生成的 PR 流水"
          fi

      - name: GitHub Release (upload signed artifacts)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.sigstore
            dist/*.sig
            dist/*.pem
            dist/github-archives/*.sigstore
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true

      # PyPI 发布只认 wheel / sdist；dist 里的 SHA256SUMS 与 .sigstore/.sig/.pem 会被
      # publish action 当作未知分发包格式而 fail-fast，故复制到干净子目录再发布。
      - name: Stage clean package dir for PyPI
        run: |
          mkdir -p dist/pypi
          cp dist/*.whl dist/*.tar.gz dist/pypi/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi
