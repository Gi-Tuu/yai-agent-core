# 保活：Render 免费层 15 分钟无流量会休眠（冷启动实测约 50 秒），所以定时轻量唤醒一次；
# 只打 GET /health（返回体 <200B，不触达模型、不花额度）。
#
# **别把这个当保活保证**：cron 写的是每 10 分钟，但 GitHub 对 scheduled workflow 是
# "尽力而为"、高峰期会大幅降频。2026-10-16 实测最近 40 次运行横跨 192 小时，
# **平均约 296 分钟一次**（中位 283、最长 537），所以实例在两次唤醒之间仍会睡——
# 直接 curl /health 拿到 200 前等了 53 秒就是证据。要真正"一直暖着"得换外部定时器
# （5 分钟一次的 uptime 服务）或常驻实例，这里只负责"别让它长期睡着"。
#
# 应用侧限流只拦 POST /v1/agent/run，/health 恒公开，因此这里收到的 429 来自
# Render/Cloudflare 边缘对数据中心 IP 的节流——服务存活、不是应用故障，
# 按成功处理，避免把边缘限流刷成仓库所有者的失败邮件。真实故障（连不上 / 5xx）
# 重试三次仍失败才红。
name: keepwarm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-health:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Wake review instance via GET /health
        run: |
          set -u
          url="https://yai-agent-core.onrender.com/health"
          last="000"
          for attempt in 1 2 3; do
            # curl 连不上时自己会打印 000，所以这里不再 || echo 000（会变成 000000）。
            last=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$url" 2>/dev/null || true)
            last=${last:-000}
            case "$last" in
              2*) echo "keepwarm ok: HTTP $last"; exit 0 ;;
              429) echo "keepwarm ok: 边缘限流 HTTP 429（服务在跑，不是应用故障）"; exit 0 ;;
            esac
            echo "第 $attempt 次探活 HTTP $last，稍后重试"
            sleep 15
          done
          echo "::error::连续 3 次探活未拿到 2xx，最后一次 HTTP $last"
          exit 1
