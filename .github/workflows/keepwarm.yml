# 保活：Render 免费层 15 分钟无流量会休眠（冷启动 30–90 秒），而外部探活门槛只有 10 秒，
# 所以每 10 分钟轻量唤醒一次；只打 GET /health（返回体 <200B，不触达模型、不花额度）。
# 应用侧限流只拦 POST /v1/agent/run，/health 恒公开，因此这里收到的 429 来自
# Render/Cloudflare 边缘对数据中心 IP 的节流——服务存活、不是应用故障，
# 按成功处理，避免把边缘限流刷成仓库所有者的失败邮件。真实故障（连不上 / 5xx）
# 重试三次仍失败才红。
name: keepwarm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-health:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Wake review instance via GET /health
        run: |
          set -u
          url="https://yai-agent-core.onrender.com/health"
          last="000"
          for attempt in 1 2 3; do
            # curl 连不上时自己会打印 000，所以这里不再 || echo 000（会变成 000000）。
            last=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$url" 2>/dev/null || true)
            last=${last:-000}
            case "$last" in
              2*) echo "keepwarm ok: HTTP $last"; exit 0 ;;
              429) echo "keepwarm ok: 边缘限流 HTTP 429（服务在跑，不是应用故障）"; exit 0 ;;
            esac
            echo "第 $attempt 次探活 HTTP $last，稍后重试"
            sleep 15
          done
          echo "::error::连续 3 次探活未拿到 2xx，最后一次 HTTP $last"
          exit 1
