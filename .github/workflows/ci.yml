name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：测试流程只读代码，无需写仓库或签发 token
permissions:
  contents: read

jobs:
  test:
    name: lint & test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # 用矩阵解释器覆盖仓库里的 .python-version(3.13)，保证 uv sync/run 不擅自换版本
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (dev + llm + server + mcp + openapi extras)
        run: uv sync --extra dev --extra llm --extra server --extra mcp --extra openapi

      - name: Ruff lint
        run: uv run ruff check src tests examples scripts

      - name: Type check (mypy)
        run: uv run mypy src/yai_core

      - name: Pytest with coverage gate
        run: uv run pytest --cov=src/yai_core --cov-report=term-missing --cov-fail-under=90
