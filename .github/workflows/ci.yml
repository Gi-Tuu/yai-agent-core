name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：测试流程只读代码，无需写仓库或签发 token
permissions:
  contents: read

# Runner 与 action 版本一律钉死，不用 *-latest：GitHub 在 2026-10-19 会把
# ubuntu-latest 迁到 Ubuntu 26，自动跟随等于在没人改代码时换掉基础镜像。
# action 引用同样钉到 commit SHA（供应链习惯），且必须是声明 node24 运行时的版本：
# v4/v5 时代的 node20 已被 GitHub 强制切到 24 并在日志里出弃用告警。
jobs:
  test:
    # 作业名里只放 linux/windows 这种稳定别名，**不放 runner 镜像标签**：
    # 分支保护的 required_status_checks 按作业名字符串匹配，名字一旦带 ubuntu-latest，
    # 换镜像就等于把必需检查改成永远不会上报的名字，PR 会被静默卡成 BLOCKED。
    name: lint & test (${{ matrix.family }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.image }}
    env:
      # 用矩阵解释器覆盖仓库里的 .python-version(3.13)，保证 uv sync/run 不擅自换版本
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        family: [linux]
        image: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - family: windows
            image: windows-2022
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # 锁文件一致性门禁：pyproject 改动（含任意 optional extra）若未同步 uv.lock 即失败。
      # uv lock 为 universal lock，默认解析全部 extras，可一并覆盖 otel/crypto 等可选
      # 依赖的漏锁。仅在单个 Linux 矩阵跑一次，该步骤属于本 test 门禁 job，失败会阻塞合并。
      - name: Verify uv.lock is up to date
        if: matrix.family == 'linux' && matrix.python-version == '3.12'
        run: uv lock --check

      - name: Install project (dev + llm + server + mcp + openapi + otel extras)
        run: uv sync --extra dev --extra llm --extra server --extra mcp --extra openapi --extra otel

      - name: Ruff lint
        run: uv run ruff check src tests examples scripts fuzzing shell

      - name: Type check (mypy)
        run: uv run mypy src/yai_core

      - name: Pytest with coverage gate
        run: uv run pytest --cov=src/yai_core --cov-report=term-missing --cov-fail-under=90

  # 模糊测试：atheris 仅在 Linux x86_64 / CPython 3.12+ 提供 wheel，故单独一个 job。
  # 该 job 不在分支保护 ruleset 的必需检查列表中（ruleset 只要求 test 矩阵与 CodeQL），
  # 因此即使失败也不阻塞合并；但会在 PR 上可见，用于持续暴露纯函数在畸形输入下的问题。
  fuzz:
    name: fuzz (atheris / ubuntu py3.12)
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project (fuzz extra)
        run: uv sync --extra fuzz
      - name: Run fuzz targets (bounded)
        run: |
          for target in fuzzing/fuzz_*.py; do
            echo "===== $target ====="
            uv run python "$target" -max_total_time=45 -print_final_stats=1
          done

  # 路由自校准 benchmark：离线确定性仿真（约 1 秒），产出学习曲线 SVG 与汇总
  # JSON artifact，为 README 中"bandit 末段显著优于规则基线"提供可复现的 CI
  # 证据链。非门禁：不在 ruleset 必需检查列表中，失败不阻塞合并。
  benchmark:
    name: router benchmark (artifact)
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project (dev extra)
        run: uv sync --extra dev
      - name: Run offline router benchmark
        run: uv run python scripts/benchmark_router.py
      # 留出集 / 冻结学习：在训练集学完、冻结参数后测没见过的任务，防止
      # "同批任务边学边测"的虚高曲线掩盖泛化退化。
      - name: Run held-out frozen-learning benchmark
        run: uv run python scripts/benchmark_router.py --holdout
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-benchmark
          path: benchmark_out/
          retention-days: 90

  # Sidecar：默认 dev 环境没有 [llm]/[mcp]，MCP 与 stdio 入口用例会被跳过；
  # 这个 job 装上真实可选依赖，把“非 Python 宿主”那条路径也纳入 CI。
  sidecar:
    name: sidecar (mcp + llm)
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project (dev + llm + mcp)
        run: uv sync --extra dev --extra llm --extra mcp
      - name: Run sidecar protocol tests
        run: uv run pytest tests/test_sidecar_protocol.py -q
      # 真跨语言：Node 宿主拉起 sidecar，工具走 Node 自己的 OpenAPI 服务，
      # 模型走本地 mock；不触外网、不需要 API Key。
      - name: Run Node host demo
        run: YAI_PYTHON="$(pwd)/.venv/bin/python" node examples/host_l_sidecar_node/host.mjs

  # 端到端 Agent 评测：ScriptedModel 真跑完整 AgentCore 的 golden 回归基线
  # （约 2 秒，离线确定），产出逐任务评分 JSON，为"完成率 / 工具正确性 / 越权 /
  # 无支撑断言"提供可复现证据。非门禁：不在 ruleset 必需检查列表，失败不阻塞合并。
  eval:
    name: agent eval (golden regression)
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project (dev extra)
        run: uv sync --extra dev
      - name: Run end-to-end agent evaluation
        run: uv run python scripts/eval_agent.py
      - name: Upload eval artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval
          path: benchmark_out/eval_agent.json
          retention-days: 90
