name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：测试流程只读代码，无需写仓库或签发 token
permissions:
  contents: read

jobs:
  test:
    name: lint & test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # 用矩阵解释器覆盖仓库里的 .python-version(3.13)，保证 uv sync/run 不擅自换版本
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (dev + llm + server + mcp + openapi extras)
        run: uv sync --extra dev --extra llm --extra server --extra mcp --extra openapi

      - name: Ruff lint
        run: uv run ruff check src tests examples scripts fuzzing shell

      - name: Type check (mypy)
        run: uv run mypy src/yai_core

      - name: Pytest with coverage gate
        run: uv run pytest --cov=src/yai_core --cov-report=term-missing --cov-fail-under=90

  # 模糊测试：atheris 仅在 Linux x86_64 / CPython 3.12+ 提供 wheel，故单独一个 job。
  # 该 job 不在分支保护 ruleset 的必需检查列表中（ruleset 只要求 test 矩阵与 CodeQL），
  # 因此即使失败也不阻塞合并；但会在 PR 上可见，用于持续暴露纯函数在畸形输入下的问题。
  fuzz:
    name: fuzz (atheris / ubuntu py3.12)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project (fuzz extra)
        run: uv sync --extra fuzz
      - name: Run fuzz targets (bounded)
        run: |
          for target in fuzzing/fuzz_*.py; do
            echo "===== $target ====="
            uv run python "$target" -max_total_time=45 -print_final_stats=1
          done

  # 路由自校准 benchmark：离线确定性仿真（约 1 秒），产出学习曲线 SVG 与汇总
  # JSON artifact，为 README 中"bandit 末段显著优于规则基线"提供可复现的 CI
  # 证据链。非门禁：不在 ruleset 必需检查列表中，失败不阻塞合并。
  benchmark:
    name: router benchmark (artifact)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project (dev extra)
        run: uv sync --extra dev
      - name: Run offline router benchmark
        run: uv run python scripts/benchmark_router.py
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: router-benchmark
          path: benchmark_out/
          retention-days: 90

  # 端到端 Agent 评测：ScriptedModel 真跑完整 AgentCore 的 golden 回归基线
  # （约 2 秒，离线确定），产出逐任务评分 JSON，为"完成率 / 工具正确性 / 越权 /
  # 无支撑断言"提供可复现证据。非门禁：不在 ruleset 必需检查列表，失败不阻塞合并。
  eval:
    name: agent eval (golden regression)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project (dev extra)
        run: uv sync --extra dev
      - name: Run end-to-end agent evaluation
        run: uv run python scripts/eval_agent.py
      - name: Upload eval artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-eval
          path: benchmark_out/eval_agent.json
          retention-days: 90
