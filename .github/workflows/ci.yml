name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint & test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # 强制 uv run 使用上一步建好的矩阵版本 venv，
      # 避免它按 .python-version(3.13) 重新下载解释器并重建 venv
      UV_ACTIVE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project (dev + llm + server extras)
        run: uv pip install -e ".[dev,llm,server]"

      - name: Ruff lint
        run: uv run ruff check src tests examples scripts

      - name: Pytest
        run: uv run pytest
