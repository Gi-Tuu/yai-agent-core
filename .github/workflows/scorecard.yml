name: Scorecard supply-chain security

# OpenSSF Scorecard 供应链安全评分。在 Linux runner 上对 checkout 的代码跑分，
# 结果以 SARIF 上传到 Code scanning，并公开发布到 api.securityscorecards.dev
# （可在 README 加 Scorecard badge）。
on:
  workflow_dispatch: # 允许在签名 Release 创建后手动重跑
  branch_protection_rule:
  schedule:
    - cron: '27 7 * * 6' # 每周六 07:27 UTC 定期评分
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
