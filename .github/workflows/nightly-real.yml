name: Nightly real-machine

# 真机回归（非阻塞）：只跑定时任务 / 手动触发，不参与 PR 门禁。
# - browser-real：真实 Chromium（Playwright）跑受控浏览器冒烟与任务 E2E；
# - windows-desktop：真实 Windows UIA（自建 WinForms + 系统应用）。
# 失败不阻塞任何 PR；结果以运行日志 + 截图 artifact 为准（见 docs/evaluations/）。

on:
  schedule:
    # 每天 03:17 UTC（避开整点高峰）
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-real
  cancel-in-progress: true

jobs:
  browser-real:
    name: browser real Chromium
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Browser smoke (reviewable JSON)
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/browser_smoke.py --json | tee artifacts/browser-smoke.json
      - name: Controlled browser task E2E
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/browser_provider_task_smoke.py | tee artifacts/browser-task-e2e.json
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-browser-${{ github.run_id }}
          path: |
            artifacts/
            docs/exports/
          if-no-files-found: ignore

  windows-desktop:
    name: windows real UIA
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package + pywinauto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows]"
      - name: UIA smoke (self-built WinForms)
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python scripts/windows_uia_smoke.py --json 2>&1 | Tee-Object -FilePath artifacts/windows-uia-smoke.json
      - name: Real app smoke (charmap.exe)
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python scripts/windows_real_apps_smoke.py 2>&1 | Tee-Object -FilePath artifacts/windows-real-apps.json
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-windows-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
