name: CopilotKit demo

on:
  push:
    paths:
      - "examples/host_ag_ui_copilotkit/**"
      - ".github/workflows/copilotkit-demo.yml"
  pull_request:
    paths:
      - "examples/host_ag_ui_copilotkit/**"
      - ".github/workflows/copilotkit-demo.yml"

permissions:
  contents: read

jobs:
  build:
    name: npm ci + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/host_ag_ui_copilotkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/host_ag_ui_copilotkit/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check build output
        run: test -f dist/index.html
