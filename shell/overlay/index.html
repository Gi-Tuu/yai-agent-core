<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAI 数字员工</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- 宿主背景占位：仅独立演示用。真实注入时浮窗浮在宿主页面之上，此节点不存在。 -->
  <div class="host-backdrop">
    <div class="host-card">宿主应用界面</div>
  </div>

  <!-- 悬浮球 -->
  <button id="orb" class="orb" aria-label="打开数字员工">
    <span class="orb-ring"></span>
    <span class="orb-core"></span>
    <span id="orb-badge" class="orb-badge hidden"></span>
  </button>

  <!-- 抽屉 -->
  <aside id="drawer" class="drawer">
    <header class="drawer-head">
      <div class="head-title">
        <span class="head-mark"></span>
        <div>
          <div class="head-name">YAI 数字员工</div>
          <div id="head-state" class="head-sub">待命</div>
        </div>
      </div>
      <div class="head-actions">
        <label class="switch" title="启用 / 停用 Core">
          <input type="checkbox" id="core-toggle" checked>
          <span class="switch-slider"></span>
        </label>
        <select id="permission-select" class="perm-select" title="权限挡位">
          <option value="manual">全部审批</option>
          <option value="partial" selected>部分审批</option>
          <option value="auto">无需审批</option>
        </select>
        <button id="drawer-close" class="icon-btn" aria-label="收起">✕</button>
      </div>
    </header>

    <!-- 动效舞台：动效即状态 -->
    <section class="stage">
      <div id="stage-flow" class="stage-flow"></div>
    </section>

    <!-- 事件 / 对话流 -->
    <section id="feed" class="feed"></section>

    <!-- 授权弹窗 -->
    <div id="permission" class="popup permission hidden">
      <div class="popup-icon shield">!</div>
      <div class="popup-body">
        <div class="popup-title">请求授权</div>
        <div id="perm-tool" class="popup-line"></div>
        <pre id="perm-args" class="popup-args"></pre>
      </div>
      <div class="popup-actions">
        <button id="perm-deny" class="btn ghost">拒绝</button>
        <button id="perm-allow" class="btn primary">批准</button>
      </div>
    </div>

    <!-- 澄清弹窗 -->
    <div id="clarify" class="popup clarify hidden">
      <div class="popup-icon ask">?</div>
      <div class="popup-body">
        <div class="popup-title">需要确认</div>
        <div id="clarify-q" class="popup-line"></div>
        <input id="clarify-input" class="text-input" placeholder="输入后回车">
      </div>
      <div class="popup-actions">
        <button id="clarify-send" class="btn primary">回答</button>
      </div>
    </div>

    <!-- 输入栏 -->
    <footer class="composer">
      <input id="task-input" class="text-input" placeholder="交代一个任务…（Enter 发送）">
      <button id="send-btn" class="btn primary">发送</button>
    </footer>
  </aside>

  <script src="overlay.js"></script>
</body>
</html>
