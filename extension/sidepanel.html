<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YAI Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">YAI</div>
      <div id="conn" class="conn unknown" title="本地 Bridge 连接状态">
        <span class="dot"></span><span id="conn-text">连接中…</span>
      </div>
    </header>

    <div id="browser-mode" class="browser-mode">
      当前标签页：只读快照（不会操作当前标签页）
    </div>

    <section class="composer">
      <label class="field-label" for="task">任务</label>
      <textarea id="task" rows="4" placeholder="描述你要在这台电脑 / 浏览器上完成的事…"></textarea>
      <div class="row">
        <button id="run" class="primary">运行</button>
        <button id="cancel" class="ghost" disabled>取消</button>
      </div>
      <div class="row">
        <button id="observe" class="ghost">读取当前页面</button>
        <label class="check">
          <input type="checkbox" id="attach-page" checked />
          只读快照附加到任务（不操作当前页）
        </label>
      </div>
      <p class="hint">
        读取页面需要你点击按钮授权；页面内容按不可信输入处理，可能包含提示注入。
      </p>
      <div id="page-preview" class="page-preview hidden"></div>
    </section>

    <details id="settings" class="settings">
      <summary>LLM 设置（保存到本机配置）</summary>
      <div class="settings-grid">
        <label>Base URL
          <input id="cfg-base-url" type="text" placeholder="https://api.suanli.cn/v1" />
        </label>
        <label>模型
          <input id="cfg-model" type="text" placeholder="deepseek/deepseek-v4.1-flash-1017" />
        </label>
        <label>强模型（可选）
          <input id="cfg-strong-model" type="text" placeholder="留空 = 不修改" />
        </label>
        <label>API Key（留空 = 不修改）
          <input id="cfg-api-key" type="password" autocomplete="off"
                 placeholder="只写入本机配置文件，不存浏览器" />
        </label>
      </div>
      <div class="row">
        <button id="cfg-load" class="ghost">读取当前配置</button>
        <button id="cfg-save" class="primary">保存到本机</button>
      </div>
      <p id="cfg-status" class="hint"></p>
    </details>

    <section id="approval" class="approval hidden">
      <div class="approval-head">
        <strong>需要确认</strong>
        <span id="approval-tool"></span>
      </div>
      <pre id="approval-payload"></pre>
      <div class="row">
        <button id="approve" class="primary">允许</button>
        <button id="deny" class="danger">拒绝</button>
      </div>
    </section>

    <section id="clarify" class="approval hidden">
      <div class="approval-head"><strong>需要补充信息</strong></div>
      <p id="clarify-question"></p>
      <input id="clarify-answer" type="text" placeholder="输入回答…" />
      <div class="row"><button id="clarify-send" class="primary">发送</button></div>
    </section>

    <section class="stream">
      <div class="stream-head">
        <span>事件流</span>
        <button id="clear" class="link">清空</button>
      </div>
      <ol id="events"></ol>
    </section>

    <footer class="statusbar">
      <span id="state">空闲</span>
      <span id="run-id"></span>
    </footer>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
