[project]
name = "yai-agent-core"
version = "0.22.1"
description = "YAI Agent Core — an embeddable, self-adaptive agent kernel for host applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gi-Tuu" }]
keywords = ["agent", "llm", "tool-calling", "mcp", "runtime", "embedded", "kernel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Gi-Tuu/yai-agent-core"
Repository = "https://github.com/Gi-Tuu/yai-agent-core"
Issues = "https://github.com/Gi-Tuu/yai-agent-core/issues"
Changelog = "https://github.com/Gi-Tuu/yai-agent-core/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Gi-Tuu/yai-agent-core/blob/main/docs/architecture.md"

[project.optional-dependencies]
# 真实模型接入（OpenAI 兼容：DeepSeek / 通义千问 / OpenAI 等）
llm = ["openai>=1.40"]
# Anthropic Messages API（Claude 系列）：与 llm 并列的可选模型后端，内核本体不依赖。
# **上界 <2**：官方 SDK 1.x→2.x 是 breaking 区间，而本项目的测试用假模块
# （见 CONTRIBUTING.md），CI 永远发现不了真实 SDK 的 API 漂移。
# 等真机验证过 2.x 再放开上界，届时另开版本。
anthropic = ["anthropic>=0.40,<2"]
# FastAPI Battery：在线 API、健康端点、X-Agent 部署验证端点
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]
# MCP Client 集成：接入外部 MCP Server 的工具（v2 稳定线，内核本体不依赖）
mcp = ["mcp>=2.0,<3"]
# OpenAPI 发现：把任意 OpenAPI 3 REST API 自动注册为工具（httpx 调用、pyyaml 解析 YAML 描述）
openapi = ["httpx>=0.27", "pyyaml>=6.0"]
# Office 文档文本抽取：PDF 走 pypdf（BSD-3、纯 Python、0.4 MB）；
# docx/xlsx/pptx 用标准库 zipfile+ElementTree，零额外依赖（batteries.office_text）
office = ["pypdf>=5.0"]
# 本地语义嵌入：bge-m3 ONNX（CPU、离线、免费、1024 维），与 AMBRACE 同模型同后处理
local-embed = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.26"]
# 结构化 tracing：OpenTelemetry（内核本体不依赖，仅 integrations.tracing 外侧订阅时需要）。
# api/sdk 产生并批处理 span，exporter-otlp 经 OTLP 发到 Jaeger/Tempo/Collector。
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
# 落盘静态加密：Fernet（AES-128-CBC + HMAC）保护长期记忆文件，仅 integrations.crypto 需要
crypto = ["cryptography>=42"]
# Fuzzing：atheris 仅在 Linux x86_64 + CPython 3.12/3.13/3.14 提供 wheel（marker 限定，
# 其它平台 uv sync 不会尝试安装）；CI 的 fuzz job 使用，详见 fuzzing/README.md
fuzz = [
    "atheris>=3.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "pypdf>=5.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]
# 构建 docs/walkthrough 讲义 Word（PDF 导出走 LibreOffice UNO，无需 pip 包）
docs = ["python-docx>=1.1"]
# 原生桌面端：PySide6 + QML 把员工做成贴顶胶囊窗口（仅 shell 用，内核仍零依赖）
desktop = ["PySide6>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yai_core"]

[tool.hatch.build.targets.sdist]
# 显式白名单：sdist 只含库源码、可跑通的测试与核心文档。hatchling 默认会打包工作区里
# 未被 .gitignore 忽略的文件，会把 docs/inbox 等本地过程稿一并带上，故改为只 include。
#
# **所有模式必须以 "/" 根锚定**：hatchling 用 pathspec.GitIgnoreSpec 编译 include，
# gitignore 语义下无斜杠的模式会匹配**任意层级**的同名文件——`"README.md"` 曾把
# examples/*/README.md、models/README.md、fuzzing/README.md 一并打进包（已发布的
# 0.21.0 sdist 就带着 9 个这样的 README.md）。
include = [
    "/src/yai_core",
    "/tests",
    # tests/ 里有 21 个模块依赖这三处（shell.desktop.*、host_* 示例、脚本），
    # 不带上它们，从 sdist 跑 pytest 会在**收集阶段**就报 21 个错。
    "/shell",
    "/examples",
    "/scripts",
    "/README.md",
    "/README.en.md",
    # .env.example：README 的安装段链接到它（只有占位符，无真实 Key）。
    "/.env.example",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CONTRIBUTING.en.md",
    "/SECURITY.md",
    # SECURITY.zh-CN.md：tests/test_security_policy_parity.py 断言中英两份同时存在。
    "/SECURITY.zh-CN.md",
    "/LICENSE",
    # ROADMAP.md：白皮书链接到它；不带上则包内那处链接是死链。
    "/ROADMAP.md",
    # uv.lock：tests/test_version_consistency.py 会读它核对版本串。
    "/uv.lock",
    # 核心文档（README 里的相对链接在 sdist 内也要可达）。
    # 刻意**不**整包 include /docs：docs/exports（构建产物）、docs/competitions
    # 与本机过程稿都在那儿；只点名带核心几篇与讲义目录。
    "/docs/architecture.md",
    "/docs/architecture.en.md",
    "/docs/reading-guide.md",
    "/docs/comparison.md",
    "/docs/comparison.en.md",
    "/docs/deployment-scaling.md",
    "/docs/deployment-scaling.en.md",
    "/docs/tracing.md",
    "/docs/tracing.en.md",
    "/docs/multilang-interop.md",
    "/docs/whitepaper.md",
    "/docs/walkthrough",
    "/docs/releases",
    # 讲义里的截图（讲义 22 的五张桌面图等）：不带则包内图片全是断链。
    "/docs/assets",
    # 白皮书与部署文档引用的赛事配图（**仅这两项被 git 跟踪的公开内容**；
    # docs/competitions 下的申报表 / 作品介绍 / 更新邮件等含个人信息的本地稿
    # 全都未被跟踪，绝不能进包）。
    "/docs/competitions/deployment.md",
    "/docs/competitions/shanghai/figs",
]
# hatchling 会自动包含任意目录下的 README（如 inbox/README.md），显式排除工作流目录。
# tests/fixtures/acc：上游 Agent Capability Contract 的官方一致性语料（Apache-2.0，
# 出处与 SHA-256 见同目录 SOURCE.md）。它是**别人的测试数据集**，我们只在源码仓库里
# 用它证明兼容层跑得对，不对外分发副本；缺该文件时 tests/test_acc_conformance.py
# 整模块 skip，从 sdist 跑测试的人不会因此报错。
exclude = [
    "inbox",
    "tests/fixtures/acc",
    # 本机过程稿只在 .git/info/exclude 里（不随仓库分发）；显式再排一次，
    # 防止将来有人把它们移进 .gitignore 之前就已经被打进包。
    "docs/项目台账*.md",
    "docs/检查点A-*.md",
    "docs/YAI*.md",
    "docs/产品化更新方案.md",
    "docs/内部备战-*.md",
    "docs/宣传视频-*.md",
    "docs/工具管理永久保留-*.md",
    "docs/终端工艺视觉-*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "shell"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# src 供 yai_core；"." 让未打包的顶层 shell/ 示例包（原生桌面壳等）可被测试导入，
# 本地与 CI 一致，不依赖手动设置 PYTHONPATH。
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
# 内核零硬依赖、第三方能力全部可选且懒加载：未安装的第三方库不阻塞类型检查。
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
