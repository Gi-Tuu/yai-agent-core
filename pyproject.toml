[project]
name = "yai-agent-core"
version = "0.15.0"
description = "YAI Agent Core — an embeddable, self-adaptive agent kernel for host applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gi-Tuu" }]
keywords = ["agent", "llm", "tool-calling", "mcp", "runtime", "embedded", "kernel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Gi-Tuu/yai-agent-core"
Repository = "https://github.com/Gi-Tuu/yai-agent-core"
Issues = "https://github.com/Gi-Tuu/yai-agent-core/issues"
Changelog = "https://github.com/Gi-Tuu/yai-agent-core/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Gi-Tuu/yai-agent-core/blob/main/docs/architecture.md"

[project.optional-dependencies]
# 真实模型接入（OpenAI 兼容：DeepSeek / 通义千问 / OpenAI 等）
llm = ["openai>=1.40"]
# Anthropic Messages API（Claude 系列）：与 llm 并列的可选模型后端，内核本体不依赖
anthropic = ["anthropic>=0.40"]
# FastAPI Battery：在线 API、健康端点、X-Agent 部署验证端点
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]
# MCP Client 集成：接入外部 MCP Server 的工具（v2 稳定线，内核本体不依赖）
mcp = ["mcp>=2.0,<3"]
# OpenAPI 发现：把任意 OpenAPI 3 REST API 自动注册为工具（httpx 调用、pyyaml 解析 YAML 描述）
openapi = ["httpx>=0.27", "pyyaml>=6.0"]
# 本地语义嵌入：bge-m3 ONNX（CPU、离线、免费、1024 维），与 AMBRACE 同模型同后处理
local-embed = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.26"]
# 结构化 tracing：OpenTelemetry（内核本体不依赖，仅 integrations.tracing 外侧订阅时需要）。
# api/sdk 产生并批处理 span，exporter-otlp 经 OTLP 发到 Jaeger/Tempo/Collector。
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
# 落盘静态加密：Fernet（AES-128-CBC + HMAC）保护长期记忆文件，仅 integrations.crypto 需要
crypto = ["cryptography>=42"]
# Fuzzing：atheris 仅在 Linux x86_64 + CPython 3.12/3.13/3.14 提供 wheel（marker 限定，
# 其它平台 uv sync 不会尝试安装）；CI 的 fuzz job 使用，详见 fuzzing/README.md
fuzz = [
    "atheris>=3.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]
# 构建 docs/walkthrough 讲义 Word（PDF 导出走 LibreOffice UNO，无需 pip 包）
docs = ["python-docx>=1.1"]
# 原生桌面端：PySide6 + QML 把员工做成贴顶胶囊窗口（仅 shell 用，内核仍零依赖）
desktop = ["PySide6>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yai_core"]

[tool.hatch.build.targets.sdist]
# 显式白名单：sdist 只含库源码、测试与核心文档。hatchling 默认会打包工作区里
# 未被 .gitignore 忽略的文件，会把 docs/inbox 等本地过程稿一并带上，故改为只 include：
include = [
    "src/yai_core",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
]
# hatchling 会自动包含任意目录下的 README（如 inbox/README.md），显式排除工作流目录。
# tests/fixtures/acc：上游 Agent Capability Contract 的官方一致性语料（Apache-2.0，
# 出处与 SHA-256 见同目录 SOURCE.md）。它是**别人的测试数据集**，我们只在源码仓库里
# 用它证明兼容层跑得对，不对外分发副本；缺该文件时 tests/test_acc_conformance.py
# 整模块 skip，从 sdist 跑测试的人不会因此报错。
exclude = ["inbox", "tests/fixtures/acc"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "shell"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# src 供 yai_core；"." 让未打包的顶层 shell/ 示例包（原生桌面壳等）可被测试导入，
# 本地与 CI 一致，不依赖手动设置 PYTHONPATH。
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
# 内核零硬依赖、第三方能力全部可选且懒加载：未安装的第三方库不阻塞类型检查。
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
