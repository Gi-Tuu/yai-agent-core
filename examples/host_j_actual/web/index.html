<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>host_j · Actual Budget 记账宿主 — 嵌入 YAI 前后对照</title>
<style>
  :root{
    --term-base:#0A0B0D; --term-surface:#121419; --term-surface-2:#181B21;
    --hairline:rgba(255,255,255,.08);
    --text:#E7EAF0; --text-2:#98A0AE; --muted:#5E6673;
    --accent:#46B58C; --bright:#5FC9A0; --tint:rgba(70,181,140,.12);
    --line:rgba(70,181,140,.34); --ink:#06140F;
    --danger:#EE6E6E; --ok:#6FCF8B; --warn:#E0B15C;
    --mono:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
    --sans:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--term-base);color:var(--text);font-family:var(--sans);
    font-size:14px;line-height:1.55;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:26px 26px;
  }
  .app{max-width:1280px;margin:0 auto;padding:22px 22px 40px}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:30px;height:30px;flex:0 0 auto;color:var(--bright)}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--text-2);font-size:12.5px;margin:2px 0 18px;font-family:var(--mono)}
  .grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{
    background:linear-gradient(180deg,var(--term-surface),#0F1116);
    border:1px solid var(--hairline);border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;min-height:560px;
  }
  .panel-head{
    display:flex;align-items:center;gap:9px;padding:12px 15px;
    border-bottom:1px solid var(--hairline);background:var(--term-surface-2);
  }
  .panel-head .dot{width:9px;height:9px;border-radius:50%}
  .panel-head h2{font-size:13.5px;margin:0;font-weight:620}
  .panel-head .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;
    color:var(--text-2);border:1px solid var(--hairline);border-radius:5px;padding:2px 7px}
  .panel.native .dot{background:var(--muted)}
  .panel.core .dot{background:var(--accent);box-shadow:0 0 10px var(--line)}
  .panel-body{padding:14px 15px;overflow:auto}
  .panel.core .panel-body{display:flex;flex-direction:column;gap:12px}

  .sect-title{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;
    color:var(--muted);text-transform:uppercase;margin:16px 0 8px}
  .sect-title:first-child{margin-top:0}
  .accounts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .card{background:var(--term-surface-2);border:1px solid var(--hairline);
    border-radius:8px;padding:10px 11px}
  .card .k{font-size:11px;color:var(--text-2)}
  .card .v{font-family:var(--mono);font-size:17px;margin-top:3px}
  .v.neg{color:var(--danger)} .v.pos{color:var(--text)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--hairline);white-space:nowrap}
  th{font-size:10.5px;color:var(--muted);font-weight:500;font-family:var(--mono)}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  tr.uncat td{background:rgba(224,177,92,.06)}
  .pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;
    border:1px solid var(--hairline);color:var(--text-2)}
  .pill.uncat{color:var(--warn);border-color:rgba(224,177,92,.4);background:rgba(224,177,92,.08)}
  .pill.cat{color:var(--text-2)}
  .budget .row{margin-bottom:11px}
  .budget .lab{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
  .budget .lab .name{color:var(--text-2)}
  .budget .lab .amt{font-family:var(--mono)}
  .bar{height:6px;border-radius:6px;background:#0C0E12;overflow:hidden;border:1px solid var(--hairline)}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .bar.over > i{background:var(--danger)}
  .over-label{color:var(--danger);font-size:10.5px;margin-left:6px}

  .actions{display:flex;gap:9px;flex-wrap:wrap}
  button{
    appearance:none;border:1px solid var(--line);background:var(--tint);color:var(--bright);
    font-family:var(--sans);font-size:12.5px;font-weight:600;border-radius:7px;
    padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:background .15s,border-color .15s;
  }
  button:hover{background:rgba(70,181,140,.2)}
  button.ghost{background:transparent;color:var(--text-2);border-color:var(--hairline)}
  button.ghost:hover{color:var(--text);border-color:var(--text-2)}
  button svg{width:14px;height:14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .taskline{font-family:var(--mono);font-size:11.5px;color:var(--text-2);
    background:var(--term-surface-2);border:1px solid var(--hairline);border-radius:7px;
    padding:9px 11px}
  .stream{
    flex:1;min-height:230px;max-height:340px;overflow:auto;
    background:#080A0D;border:1px solid var(--hairline);border-radius:8px;padding:11px 12px;
    font-family:var(--mono);font-size:11.5px;
  }
  .ev{display:flex;gap:9px;padding:3px 0;align-items:baseline}
  .ev .tag{flex:0 0 78px;font-size:10px;letter-spacing:.5px;padding:1px 6px;border-radius:4px;
    text-align:center;height:fit-content;border:1px solid var(--hairline);color:var(--text-2)}
  .ev .msg{color:var(--text-2);word-break:break-all}
  .tag.t-wake{color:var(--bright);border-color:var(--line)}
  .tag.t-tool{color:#8FB7E8;border-color:rgba(143,183,232,.3)}
  .tag.t-gap{color:var(--warn);border-color:rgba(224,177,92,.4)}
  .tag.t-find{color:var(--ok);border-color:rgba(111,207,139,.4)}
  .tag.t-auth{color:#D9A6E0;border-color:rgba(217,166,224,.35)}
  .tag.t-done{color:var(--ink);background:var(--accent);border-color:var(--accent);font-weight:700}
  .tag.t-model{color:var(--muted)}
  .final{
    border:1px solid var(--line);background:var(--tint);border-radius:8px;padding:11px 13px;
    font-size:12.5px;color:var(--text);white-space:pre-wrap;display:none;
  }
  .final.show{display:block}
  .final .h{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--bright);
    margin-bottom:6px;text-transform:uppercase}
  .after{display:none;grid-template-columns:1fr 1fr;gap:9px}
  .after.show{display:grid}
  .hint{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .cursor{display:inline-block;width:7px;height:13px;background:var(--bright);
    vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <path d="M7 9h10M7 13h6M7 17h8"/>
    </svg>
    <div>
      <h1>host_j · Actual Budget 记账宿主</h1>
      <div class="sub">同一个记账应用，嵌入 YAI Agent Core 前后的对照 · 离线脚本模型 · 仅本机</div>
    </div>
  </header>

  <div class="grid">
    <!-- 左：原生应用 -->
    <section class="panel native">
      <div class="panel-head">
        <span class="dot"></span><h2>原生记账应用</h2>
        <span class="tag">无 Core</span>
      </div>
      <div class="panel-body">
        <div class="sect-title">账户</div>
        <div class="accounts" id="accounts"></div>

        <div class="sect-title">本月交易 <span class="hint" id="uncatHint"></span></div>
        <table>
          <thead><tr><th>日期</th><th>收款方</th><th class="num">金额(元)</th><th>分类</th></tr></thead>
          <tbody id="txBody"></tbody>
        </table>

        <div class="sect-title">预算对比</div>
        <div class="budget" id="budget"></div>
      </div>
    </section>

    <!-- 右：嵌入 Core -->
    <section class="panel core">
      <div class="panel-head">
        <span class="dot"></span><h2>嵌入 YAI Agent Core</h2>
        <span class="tag">自适应 · 发现 / 委派</span>
      </div>
      <div class="panel-body">
        <div class="actions">
          <button id="btnDiscover">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            对账：发现补分类能力
          </button>
          <button id="btnDelegate" class="ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/></svg>
            并行：派两个只读子员工
          </button>
        </div>
        <div class="taskline" id="taskline">选择上方任一动作，观察内核的事件流五拍。</div>
        <div class="stream" id="stream">
          <div class="hint">事件流将在此逐条播放：唤醒 → 长尾任务 → 能力缺口 → 发现/委派 → 授权 → 完成。</div>
        </div>
        <div class="after" id="after">
          <div class="card"><div class="k">补分类后未分类</div>
            <div class="v" id="afterUncat" style="color:var(--accent)">–</div></div>
          <div class="card"><div class="k">本月超支分类</div>
            <div class="v" id="afterOver" style="color:var(--danger);font-size:14px">–</div></div>
        </div>
        <div class="final" id="final"><div class="h">根员工最终结果</div><span id="finalText"></span></div>
      </div>
    </section>
  </div>
</div>

<script>
const yuan = (n) => (n < 0 ? "-" : "") + "¥" + Math.abs(n).toFixed(2);
const EV_META = {
  strategy_selected:["唤醒","t-wake"], tool_call:["工具调用","t-tool"],
  tool_result:["观察","t-tool"], permission_asked:["请求授权","t-auth"],
  capability_missing:["能力缺口","t-gap"], tool_discovered:["发现工具","t-find"],
  model_message:["模型","t-model"], plan_created:["规划","t-wake"],
  done:["完成","t-done"], error:["错误","t-gap"],
};

async function getJSON(p){ const r = await fetch(p); return r.json(); }

async function renderNative(){
  const [accs, txs, budget, ov] = await Promise.all([
    getJSON("/api/accounts"), getJSON("/api/transactions"),
    getJSON("/api/budget"), getJSON("/api/overview"),
  ]);
  document.getElementById("accounts").innerHTML = accs.accounts.map(a => `
    <div class="card"><div class="k">${a.name} · ${a.type}</div>
      <div class="v ${a.balance_yuan < 0 ? "neg" : "pos"}">${yuan(a.balance_yuan)}</div></div>`).join("");
  document.getElementById("uncatHint").textContent =
    `共 ${txs.total} 笔，未分类 ${ov.uncategorized_count} 笔`;
  document.getElementById("txBody").innerHTML = txs.transactions.map(t => `
    <tr class="${t.uncategorized ? "uncat" : ""}">
      <td>${t.date}</td><td>${t.payee}</td>
      <td class="num">${yuan(t.amount_yuan)}</td>
      <td>${t.uncategorized
        ? '<span class="pill uncat">未分类</span>'
        : '<span class="pill cat">' + (t.category || "–") + "</span>"}</td>
    </tr>`).join("");
  document.getElementById("budget").innerHTML = budget.lines.map(l => {
    const pct = Math.min(110, Math.round(l.spent_yuan / l.budget_yuan * 100));
    return `<div class="row">
      <div class="lab"><span class="name">${l.category}${l.over_budget ? '<span class="over-label">超支</span>':""}</span>
        <span class="amt">${l.spent_yuan.toFixed(0)} / ${l.budget_yuan.toFixed(0)}</span></div>
      <div class="bar ${l.over_budget ? "over" : ""}"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

function appendEvent(type, data){
  const stream = document.getElementById("stream");
  const [label, cls] = EV_META[type] || [type, "t-model"];
  let msg = "";
  if (type === "tool_call") msg = (data.tool || "") + "(" + JSON.stringify(data.arguments || {}) + ")";
  else if (type === "tool_result") msg = (data.tool || "") + " → " + (data.preview || JSON.stringify(data)).slice(0, 120);
  else if (type === "permission_asked") msg = "请确认是否允许：" + (data.tool || "");
  else if (type === "capability_missing") msg = data.missing_capability || data.missing || JSON.stringify(data);
  else if (type === "tool_discovered") msg = "新工具已注册：" + (data.tool || data.name || "");
  else if (type === "strategy_selected") msg = (data.strategy || "") + " · " + (data.reason || "");
  else if (type === "model_message") msg = data.text || "";
  else msg = JSON.stringify(data);
  const row = document.createElement("div");
  row.className = "ev";
  row.innerHTML = `<span class="tag ${cls}">${label}</span><span class="msg"></span>`;
  row.querySelector(".msg").textContent = msg;
  stream.appendChild(row);
  stream.scrollTop = stream.scrollHeight;
}

async function runCore(mode, task){
  const btnD = document.getElementById("btnDiscover");
  const btnG = document.getElementById("btnDelegate");
  btnD.disabled = btnG.disabled = true;
  document.getElementById("taskline").textContent = "任务：" + task;
  const stream = document.getElementById("stream");
  stream.innerHTML = "";
  document.getElementById("final").classList.remove("show");
  document.getElementById("after").classList.remove("show");
  try{
    const r = await fetch("/api/run", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({mode, task}),
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "运行失败");
    for(const ev of data.events){
      appendEvent(ev.type, ev.data);
      await new Promise(res => setTimeout(res, 140));
    }
    document.getElementById("finalText").textContent = data.final_text || "(无文本结果)";
    document.getElementById("final").classList.add("show");
    if(mode === "discover" && data.overview_after){
      document.getElementById("afterUncat").textContent =
        data.overview_after.uncategorized_count + " 笔";
      document.getElementById("afterOver").textContent =
        data.overview_after.over_budget_categories.join("、") || "无";
      document.getElementById("after").classList.add("show");
    }
  }catch(err){
    appendEvent("error", {error: String(err)});
  }finally{
    btnD.disabled = btnG.disabled = false;
  }
}

const DISCOVER_TASK = "请帮我完成 2026-09 的月度对账：列出本月交易，对未分类的交易先判断该归到哪个分类，征得同意后批量补上分类，再核对各分类预算是否超支，最后给我一份简短月报。";
const DELEGATE_TASK = "请并行处理两块只读汇总并列出结果：第一块列出全部账户与当前余额，第二块统计本月对账概览（未分类笔数、支出、超预算分类），最后由你汇总。";

document.getElementById("btnDiscover").addEventListener("click", () => runCore("discover", DISCOVER_TASK));
document.getElementById("btnDelegate").addEventListener("click", () => runCore("delegate", DELEGATE_TASK));
renderNative();
</script>
</body>
</html>
