<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销售 CRM</title>
<style>
  :root {
    /* 宿主层 · 浅色中性石墨（墨黑 = 应用自身操作） */
    --text: #14161A; --text-2: #5E6673; --text-3: #8A909C;
    --bg: #F4F5F7; --card: #FCFCFD; --card-2: #FFFFFF;
    --border: #E4E7EC; --border-strong: #CDD2DA;
    --accent: #14161A; --accent-d: #2A2E36; --accent-tint: rgba(20,22,26,.05);
    --ok: #1F7A4D; --warn: #9A6B12; --err: #B4382E;
    /* 字体 / 尺度 */
    --font-mono: 'JBMono','Cascadia Code','Cascadia Mono','JetBrains Mono',Consolas,'Courier New',monospace;
    --font-sans: 'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'PingFang SC',
      'Microsoft YaHei UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
    --r-inner: 4px; --r-card: 6px; --r-panel: 8px;
    --ease-out: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  /* ---------- 原生应用框架（中性石墨；墨黑 = 应用自身操作） ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    border-bottom: 1px solid var(--border); background: var(--card-2);
    padding: 10px 22px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .app-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .app-sub { font-size: 12px; color: var(--text-2); }
  .topbar .spacer { margin-left: auto; }
  button { font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--border);
    background: var(--card-2); color: var(--text); border-radius: var(--r-card); padding: 8px 14px; min-height: 36px;
    transition: border-color .16s var(--ease-out), color .16s var(--ease-out), background .16s var(--ease-out); }
  button:hover:not(:disabled) { border-color: var(--border-strong); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-d); border-color: var(--accent-d); color: #fff; }
  button.danger { color: var(--err); border-color: rgba(180,56,46,.32); }
  button.small { min-height: 28px; padding: 3px 10px; font-size: 12px; border-radius: var(--r-inner); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .kpis { display: flex; gap: 12px; padding: 16px 22px 0; flex-wrap: wrap; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-panel);
    padding: 12px 16px; min-width: 150px; flex: 1 1 150px; max-width: 240px; }
  .kpi .label { font-size: 11px; color: var(--text-2); }
  .kpi .value { font-size: 22px; font-weight: 700; margin-top: 2px; font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .kpi .value.warn { color: var(--warn); }
  .tabs { display: flex; gap: 2px; padding: 14px 22px 0; flex-wrap: wrap; }
  .tab { border-bottom: 2px solid transparent; border-radius: 0; background: none;
    padding: 8px 14px; min-height: 36px; color: var(--text-2); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
  .content { flex: 1; overflow-y: auto; padding: 16px 22px 28px; }
  .view { display: none; max-width: 1080px; }
  .view.active { display: block; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-panel);
    padding: 14px 16px; margin-bottom: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 14px; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-2); font-weight: 600; font-size: 11.5px; background: #F2F3F5; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(20,22,26,.018); }
  td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 11px; border-radius: var(--r-inner); padding: 0 7px;
    font-family: var(--font-mono); }
  .tag.key { background: rgba(20,22,26,.08); color: var(--text); }
  .tag.normal { background: #F0F1F3; color: var(--text-2); }
  .tag.overdue { background: rgba(180,56,46,.10); color: var(--err); }
  .tag.ok { background: rgba(31,122,77,.10); color: var(--ok); }
  .tag.done { background: #F0F1F3; color: var(--text-2); text-decoration: line-through; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, textarea { font-family: inherit; font-size: 13px; border: 1px solid var(--border);
    border-radius: var(--r-card); padding: 8px 10px; color: var(--text); background: var(--card-2); }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(20,22,26,.14); border-color: var(--border-strong); }
  .muted { color: var(--text-2); font-size: 12px; }
  .brief { white-space: pre-wrap; font-size: 13px; line-height: 1.9; }
  /* ---------- 客户详情弹层 ---------- */
  .modal-mask { position: fixed; inset: 0; background: rgba(16,18,22,.40);
    display: none; align-items: flex-start; justify-content: center; z-index: 60;
    padding: 46px 16px; overflow-y: auto; }
  .modal-mask.open { display: flex; }
  .modal { background: var(--card-2); border: 1px solid var(--border); border-radius: 10px;
    width: 100%; max-width: 720px; box-shadow: 0 8px 24px rgba(20,22,26,.08); }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .modal-body { padding: 16px 18px 20px; }
  .detail-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 5px 18px;
    margin-bottom: 14px; font-size: 13px; }
  .detail-grid .k { color: var(--text-2); }
  .detail-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .detail-summary .chip { background: var(--card-2); border: 1px solid var(--border);
    border-radius: var(--r-card); padding: 8px 12px; font-size: 12px; }
  .detail-summary .chip b { font-size: 15px; font-family: var(--font-mono); }
  .detail-section h4 { margin: 16px 0 6px; font-size: 13px; }
  .detail-empty { color: var(--text-2); font-size: 12px; padding: 4px 0; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #14161A; color: #fff; font-size: 12.5px; padding: 8px 14px; border-radius: var(--r-card);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 80; max-width: 80vw;
    border: 1px solid rgba(255,255,255,.08); }
  .toast.show { opacity: .96; }
  /* ---------- 客户搜索筛选 / 编辑面板（宿主中性，业务不用琥珀） ---------- */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filter-bar input { min-width: 180px; flex: 1; max-width: 260px; }
  .filter-bar select { min-width: 110px; }
  .edit-panel { display: none; border-color: var(--border-strong); background: var(--accent-tint);
    border-radius: var(--r-panel); }
  .edit-panel.open { display: block; }
  .tag.status-潜在 { background: rgba(94,102,115,.14); color: var(--text-2); }
  .tag.status-合作中 { background: rgba(31,122,77,.10); color: var(--ok); }
  .tag.status-流失 { background: rgba(180,56,46,.10); color: var(--err); }
  .tag.stage { background: #F0F1F3; color: var(--text-2); }
  .tag.stage-win { background: rgba(31,122,77,.10); color: var(--ok); }
  .tag.stage-lose { background: rgba(180,56,46,.08); color: var(--err); }
  /* ---------- 商机看板 ---------- */
  .kanban { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; align-items: flex-start; }
  .kanban-col { flex: 0 0 172px; min-width: 172px; background: #F2F3F5; border: 1px solid var(--border);
    border-radius: var(--r-panel); padding: 9px; }
  .kanban-col.win { background: rgba(31,122,77,.06); }
  .kanban-col.lose { background: rgba(180,56,46,.05); }
  .kanban-col h4 { margin: 0 0 8px; font-size: 12.5px; display: flex; justify-content: space-between;
    align-items: center; color: var(--text); }
  .kanban-col .col-sum { font-weight: 500; color: var(--text-2); font-size: 11px;
    font-family: var(--font-mono); }
  .kanban-card { background: var(--card-2); border: 1px solid var(--border); border-radius: var(--r-card);
    padding: 8px 9px; margin-bottom: 8px; font-size: 12px; }
  .kanban-card .kc-title { font-weight: 600; font-size: 12.5px; }
  .kanban-card .kc-cust { color: var(--text-2); margin: 2px 0; }
  .kanban-card .kc-amt { font-weight: 700; color: var(--text); font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; }
  .kanban-card select { font-size: 11.5px; padding: 3px 6px; min-height: 28px; margin-top: 7px; width: 100%; }
  .kanban-empty { font-size: 11.5px; color: var(--text-2); padding: 4px 0; }

</style>

<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="app-title">销售 CRM <span style="font-weight:400;font-size:12px;color:var(--text-2)">（演示版 · 数据虚构）</span></div>
      <div class="app-sub">客户 · 订单 · 跟进 · 待办 · 日报 —— 这是软件本来的样子</div>
    </div>
    <div class="spacer"></div>
    <button class="small" id="btnReset">重置演示数据</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <nav class="tabs">
    <button class="tab active" data-view="customers">客户</button>
    <button class="tab" data-view="orders">订单</button>
    <button class="tab" data-view="opportunities">商机</button>
    <button class="tab" data-view="followups">跟进记录</button>
    <button class="tab" data-view="todos">待办</button>
    <button class="tab" data-view="brief">今日日报</button>
  </nav>

  <main class="content">
    <section class="view active" id="view-customers">
      <div class="panel">
        <h3>新增客户（软件原生功能）</h3>
        <div class="form-row">
          <input id="cuName" placeholder="客户姓名" style="min-width:120px">
          <input id="cuCompany" placeholder="公司名称" style="flex:1;min-width:180px">
          <select id="cuLevel">
            <option value="普通">普通</option>
            <option value="重点">重点</option>
          </select>
          <button class="primary small" id="btnAddCustomer" style="min-height:36px">新增客户</button>
        </div>
      </div>
      <div class="panel edit-panel" id="editCustomerPanel">
        <h3>编辑客户 <span id="ecName" class="muted"></span></h3>
        <div class="form-row">
          <input id="ecCompany" placeholder="公司名称" style="flex:1;min-width:180px">
          <input id="ecPhone" placeholder="联系电话" style="min-width:150px">
          <select id="ecLevel"><option value="重点">重点</option><option value="普通">普通</option></select>
          <select id="ecStatus"><option value="潜在">潜在</option><option value="合作中">合作中</option><option value="流失">流失</option></select>
          <button class="primary small" id="btnSaveCustomer" style="min-height:36px">保存修改</button>
          <button class="small" id="btnCancelEditCustomer" style="min-height:36px">取消</button>
        </div>
      </div>
      <div class="panel">
        <h3>客户档案</h3>
        <div class="filter-bar" style="margin-bottom:10px">
          <input id="cuSearch" placeholder="搜索姓名或公司…">
          <select id="cuFilterLevel"><option value="">全部等级</option><option value="重点">重点</option><option value="普通">普通</option></select>
          <select id="cuFilterStatus"><option value="">全部状态</option><option value="潜在">潜在</option><option value="合作中">合作中</option><option value="流失">流失</option></select>
          <span class="muted" id="cuCount"></span>
        </div>
        <table><thead><tr><th>姓名</th><th>公司</th><th>电话</th><th>等级</th><th>负责人</th><th>最近跟进</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="tbCustomers"></tbody></table>
      </div>
    </section>

    <section class="view" id="view-orders">
      <div class="panel">
        <h3>录入订单（软件原生功能）</h3>
        <div class="form-row">
          <select id="orCustomer" style="min-width:180px"></select>
          <select id="orCategory">
            <option value="硬件">硬件</option>
            <option value="软件">软件</option>
            <option value="服务">服务</option>
          </select>
          <input id="orAmount" type="number" min="1" placeholder="金额（元）" style="min-width:120px">
          <input id="orRegion" placeholder="区域（可选）" style="min-width:110px">
          <input id="orProduct" placeholder="产品（可选）" style="flex:1;min-width:140px">
          <button class="primary small" id="btnAddOrder" style="min-height:36px">录入订单</button>
        </div>
      </div>
      <div class="panel">
        <h3>订单与销售额</h3>
        <div class="form-row" style="margin-bottom:8px;gap:8px">
          <select id="orFilterCategory" style="min-width:120px">
            <option value="">全部品类</option>
            <option value="硬件">硬件</option>
            <option value="软件">软件</option>
            <option value="服务">服务</option>
          </select>
          <select id="orFilterRegion" style="min-width:120px"><option value="">全部区域</option></select>
          <input id="orFilterKw" placeholder="搜索订单号 / 客户 / 产品" style="flex:1;min-width:200px">
        </div>
        <div id="orderSummary" class="muted" style="margin-bottom:8px"></div>
        <table><thead><tr><th>订单号</th><th>客户</th><th>品类</th><th>产品</th><th>金额</th><th>区域</th><th></th></tr></thead>
        <tbody id="tbOrders"></tbody></table>
      </div>
    </section>

    <section class="view" id="view-opportunities">
      <div class="panel">
        <h3>新建商机（软件原生功能）</h3>
        <div class="form-row">
          <input id="opTitle" placeholder="商机名称，如：产线改造二期" style="flex:1;min-width:200px">
          <select id="opCustomer" style="min-width:180px"></select>
          <input id="opAmount" type="number" min="0" placeholder="预期金额（元）" style="min-width:130px">
          <select id="opStage">
            <option value="初步接触">初步接触</option>
            <option value="需求确认">需求确认</option>
            <option value="方案报价">方案报价</option>
            <option value="谈判">谈判</option>
            <option value="赢单">赢单</option>
            <option value="输单">输单</option>
          </select>
          <button class="primary small" id="btnAddOpp" style="min-height:36px">新建商机</button>
        </div>
      </div>
      <div class="panel">
        <h3>商机管道 <span class="muted" id="pipelineSummary"></span></h3>
        <div class="kanban" id="kanban"></div>
      </div>
    </section>

    <section class="view" id="view-followups">
      <div class="panel">
        <h3>新增跟进（软件原生功能）</h3>
        <div class="form-row">
          <select id="fuCustomer"></select>
          <input id="fuContent" placeholder="跟进内容，如：电话沟通，客户有意向下周看方案" style="flex:1;min-width:240px">
          <button class="primary small" id="btnAddFollowup" style="min-height:36px">记录跟进</button>
        </div>
      </div>
      <div class="panel">
        <h3>跟进记录</h3>
        <table><thead><tr><th>日期</th><th>客户</th><th>内容</th><th></th></tr></thead>
        <tbody id="tbFollowups"></tbody></table>
      </div>
    </section>

    <section class="view" id="view-todos">
      <div class="panel">
        <h3>新建待办（软件原生功能）</h3>
        <div class="form-row">
          <input id="tdTitle" placeholder="待办标题，如：下周二前发送报价单" style="flex:1;min-width:240px">
          <input id="tdDue" type="date">
          <button class="primary small" id="btnAddTodo" style="min-height:36px">新建待办</button>
        </div>
      </div>
      <div class="panel">
        <h3>未完成</h3>
        <table><thead><tr><th>事项</th><th>截止</th><th></th></tr></thead><tbody id="tbTodosOpen"></tbody></table>
        <h3 style="margin-top:14px">已完成</h3>
        <table><tbody id="tbTodosDone"></tbody></table>
      </div>
    </section>

    <section class="view" id="view-brief">
      <div class="panel">
        <h3>今日销售日报（软件自带模板）</h3>
        <div class="brief" id="briefBox"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="customerModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="cmTitle">客户详情</h3>
      <button class="small" id="cmClose">关闭</button>
    </div>
    <div class="modal-body" id="cmBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var snap = null;
  var customerFilter = { keyword: '', level: '', status: '' };
  var orderFilter = { category: '', region: '', kw: '' };
  var editingCustomer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function money(n) { return '¥' + Number(n || 0).toLocaleString('zh-CN'); }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function post(path, payload) {
    return fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload || {})
    }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); });
  }

  /* ---------- 原生 CRM 渲染 ---------- */
  function renderSnapshot(s) {
    snap = s;
    var dueMap = {};
    s.due_followup.forEach(function (d) { dueMap[d.name] = d.days_overdue; });
    var openTodos = s.todos.filter(function (t) { return !t.done; });
    var keyCustomers = s.customers.filter(function (c) { return c.level === '重点'; }).length;
    var kpis = [
      ['客户总数', s.customers.length + ' 位', ''],
      ['重点客户', keyCustomers + ' 位', ''],
      ['订单总额', money(s.total_amount), ''],
      ['在途商机金额', money(s.pipeline_amount), ''],
      ['超 3 天未跟进', s.due_followup.length + ' 位', s.due_followup.length ? 'warn' : ''],
      ['未完成待办', openTodos.length + ' 项', '']
    ];
    document.getElementById('kpis').innerHTML = kpis.map(function (k) {
      return '<div class="kpi"><div class="label">' + k[0] + '</div><div class="value ' + k[2] + '">' +
             k[1] + '</div></div>';
    }).join('');

    /* 客户档案：关键词 + 等级 + 状态筛选（纯前端过滤，不经 Agent） */
    var kw = customerFilter.keyword.trim().toLowerCase();
    var shownCustomers = s.customers.filter(function (c) {
      if (customerFilter.level && c.level !== customerFilter.level) return false;
      if (customerFilter.status && c.status !== customerFilter.status) return false;
      if (kw && (c.name + ' ' + c.company).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    document.getElementById('cuCount').textContent =
      '显示 ' + shownCustomers.length + ' / 共 ' + s.customers.length + ' 位';
    document.getElementById('tbCustomers').innerHTML = shownCustomers.length ? shownCustomers.map(function (c) {
      var overdue = dueMap[c.name];
      var followCell = esc(c.last_followup) +
        (overdue != null ? '<br><span class="tag overdue">超期 ' + overdue + ' 天</span>' : '');
      var statusTag = '<span class="tag status-' + esc(c.status) + '">' + esc(c.status) + '</span>';
      return '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.company) + '</td><td>' +
        (c.phone ? esc(c.phone) : '<span class="muted">—</span>') + '</td><td>' +
        '<span class="tag ' + (c.level === '重点' ? 'key' : 'normal') + '">' + esc(c.level) + '</span>' +
        '</td><td>' + esc(c.owner) + '</td><td>' + followCell + '</td><td>' + statusTag + '</td><td>' +
        '<button class="small" data-detail-customer="' + esc(c.name) + '">详情</button> ' +
        '<button class="small" data-edit-customer="' + esc(c.name) + '">编辑</button> ' +
        '<button class="small danger" data-delete-customer="' + esc(c.name) + '">删除</button></td></tr>';
    }).join('') : '<tr><td colspan="8" class="muted">没有符合条件的客户</td></tr>';

    /* 订单筛选：品类 + 区域 + 关键词（纯前端，不经 Agent）；区域下拉按数据动态生成 */
    var regionSel = document.getElementById('orFilterRegion');
    var regions = s.orders.map(function (o) { return o.region; })
      .filter(function (r, i, a) { return r && a.indexOf(r) === i; });
    regionSel.innerHTML = '<option value="">全部区域</option>' +
      regions.map(function (r) {
        return '<option value="' + esc(r) + '"' + (orderFilter.region === r ? ' selected' : '') + '>' +
          esc(r) + '</option>';
      }).join('');
    var okw = orderFilter.kw.trim().toLowerCase();
    var shownOrders = s.orders.filter(function (o) {
      if (orderFilter.category && o.category !== orderFilter.category) return false;
      if (orderFilter.region && o.region !== orderFilter.region) return false;
      if (okw && (o.order + ' ' + o.customer + ' ' + (o.product || '')).toLowerCase().indexOf(okw) < 0) return false;
      return true;
    });
    var shownTotal = shownOrders.reduce(function (a, o) { return a + o.amount; }, 0);
    document.getElementById('orderSummary').innerHTML =
      '显示 ' + shownOrders.length + ' / 共 ' + s.orders.length + ' 笔 · 合计 ' + money(shownTotal) +
      (shownOrders.length === s.orders.length ? '（总 ' + money(s.total_amount) + '）' : '');
    document.getElementById('tbOrders').innerHTML = shownOrders.length ? shownOrders.map(function (o) {
      return '<tr><td>' + esc(o.order) + '</td><td>' + esc(o.customer) + '</td><td>' + esc(o.category) +
        '</td><td>' + (o.product ? esc(o.product) : '<span class="muted">—</span>') + '</td><td>' +
        money(o.amount) + '</td><td>' + esc(o.region) + '</td><td>' +
        '<button class="small danger" data-delete-order="' + esc(o.order) + '">删除</button></td></tr>';
    }).join('') : '<tr><td colspan="7" class="muted">没有符合条件的订单</td></tr>';

    /* 订单 / 商机表单的客户下拉：用公司名（后端同时接受姓名与公司名） */
    var companyOpts = s.customers.map(function (c) {
      return '<option value="' + esc(c.company) + '">' + esc(c.company) + '</option>';
    }).join('');
    document.getElementById('orCustomer').innerHTML = companyOpts;
    document.getElementById('opCustomer').innerHTML = companyOpts;

    /* 商机管道：按阶段渲染看板，终态（赢单/输单）不显示推进 */
    var stages = (s.enums && s.enums.stages) ||
      ['初步接触', '需求确认', '方案报价', '谈判', '赢单', '输单'];
    var openStageSet = { '初步接触': 1, '需求确认': 1, '方案报价': 1, '谈判': 1 };
    document.getElementById('pipelineSummary').textContent =
      '在途 ' + s.opportunities.filter(function (o) { return openStageSet[o.stage]; }).length +
      ' 个 · ' + money(s.pipeline_amount);
    document.getElementById('kanban').innerHTML = stages.map(function (stage) {
      var items = s.opportunities.filter(function (o) { return o.stage === stage; });
      var sum = items.reduce(function (a, o) { return a + o.amount; }, 0);
      var colCls = stage === '赢单' ? 'win' : stage === '输单' ? 'lose' : '';
      var cards = items.length ? items.map(function (o) {
        var advance = openStageSet[stage]
          ? '<select data-opp-stage="' + esc(o.title) + '"><option value="">推进到…</option>' +
            stages.filter(function (st) { return st !== stage; }).map(function (st) {
              return '<option value="' + st + '">→ ' + st + '</option>';
            }).join('') + '</select>'
          : '';
        return '<div class="kanban-card"><div class="kc-title">' + esc(o.title) + '</div>' +
          '<div class="kc-cust">' + esc(o.customer) + ' · ' + esc(o.owner || '') + '</div>' +
          '<div class="kc-amt">' + money(o.amount) + '</div>' + advance +
          '<button class="small danger" style="margin-top:6px" data-delete-opp="' +
            esc(o.title) + '">删除商机</button></div>';
      }).join('')
      : '<div class="kanban-empty">暂无</div>';
      return '<div class="kanban-col ' + colCls + '"><h4><span>' + stage + '</span>' +
        '<span class="col-sum">' + items.length + ' · ' + money(sum) + '</span></h4>' + cards + '</div>';
    }).join('');

    var fuSel = document.getElementById('fuCustomer');
    fuSel.innerHTML = s.customers.map(function (c) {
      return '<option value="' + esc(c.name) + '">' + esc(c.name) + '（' + esc(c.company) + '）</option>';
    }).join('');
    var fus = s.followups.slice().reverse();
    document.getElementById('tbFollowups').innerHTML = fus.length ? fus.map(function (f) {
      return '<tr><td style="white-space:nowrap">' + esc(f.created_at) + '</td><td>' + esc(f.customer) +
        '</td><td>' + esc(f.content) + '</td><td></td></tr>';
    }).join('') : '<tr><td colspan="4" class="muted">暂无跟进记录</td></tr>';

    document.getElementById('tbTodosOpen').innerHTML = openTodos.length ? openTodos.map(function (t) {
      return '<tr><td>' + esc(t.title) + '</td><td>' + (t.due ? esc(t.due) : '<span class="muted">无</span>') +
        '</td><td><button class="small" data-complete="' + esc(t.title) + '">标记完成</button> ' +
        '<button class="small danger" data-delete-todo="' + esc(t.title) + '">删除</button></td></tr>';
    }).join('') : '<tr><td colspan="3" class="muted">没有未完成待办</td></tr>';
    var doneTodos = s.todos.filter(function (t) { return t.done; });
    document.getElementById('tbTodosDone').innerHTML = doneTodos.length ? doneTodos.map(function (t) {
      return '<tr><td><span class="tag done">' + esc(t.title) + '</span></td><td>' +
        '<button class="small danger" data-delete-todo="' + esc(t.title) + '">删除</button></td></tr>';
    }).join('') : '<tr><td class="muted">暂无</td></tr>';

    document.getElementById('briefBox').textContent = s.brief;
  }

  function refreshSnapshot() {
    return fetch('/api/snapshot').then(function (r) { return r.json(); }).then(renderSnapshot);
  }

  /* ---------- 标签页 ---------- */
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll('.view').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('view-' + t.getAttribute('data-view')).classList.add('active');
    });
  });

  /* ---------- 原生写操作（不经 Agent） ---------- */
  document.getElementById('btnAddFollowup').addEventListener('click', function () {
    var customer = document.getElementById('fuCustomer').value;
    var content = document.getElementById('fuContent').value.trim();
    if (!content) { toast('请填写跟进内容'); return; }
    post('/api/crm/followup', { customer: customer, content: content }).then(function (r) {
      if (r.s === 200 && r.j.ok) {
        toast('已记录跟进：' + customer);
        document.getElementById('fuContent').value = '';
        return refreshSnapshot();
      }
      toast((r.j && r.j.error) || ('失败（' + r.s + '）'));
    });
  });
  document.getElementById('btnAddTodo').addEventListener('click', function () {
    var title = document.getElementById('tdTitle').value.trim();
    if (!title) { toast('请填写待办标题'); return; }
    var due = document.getElementById('tdDue').value;
    post('/api/crm/todo', { title: title, due: due }).then(function (r) {
      if (r.s === 200 && r.j.ok) {
        toast('已新建待办');
        document.getElementById('tdTitle').value = '';
        document.getElementById('tdDue').value = '';
        return refreshSnapshot();
      }
      toast((r.j && r.j.error) || ('失败（' + r.s + '）'));
    });
  });
  document.getElementById('btnAddCustomer').addEventListener('click', function () {
    var name = document.getElementById('cuName').value.trim();
    var company = document.getElementById('cuCompany').value.trim();
    var level = document.getElementById('cuLevel').value;
    if (!name) { toast('请填写客户姓名'); return; }
    if (!company) { toast('请填写公司名称'); return; }
    post('/api/crm/customer', { name: name, company: company, level: level }).then(function (r) {
      if (r.s === 200 && r.j.ok) {
        toast('已新增客户：' + name);
        document.getElementById('cuName').value = '';
        document.getElementById('cuCompany').value = '';
        document.getElementById('cuLevel').value = '普通';
        return refreshSnapshot();
      }
      toast((r.j && r.j.error) || ('失败（' + r.s + '）'));
    });
  });
  function deleteDone(label) {
    return function (r) {
      if (r.s === 200 && r.j.ok) { toast('已删除：' + label); return refreshSnapshot(); }
      toast((r.j && r.j.error) || '删除失败');
    };
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    var title = t.getAttribute('data-complete');
    if (title) {
      post('/api/crm/complete', { title: title }).then(function (r) {
        if (r.s === 200 && r.j.ok) { toast('已完成：' + title); return refreshSnapshot(); }
        toast((r.j && r.j.error) || '操作失败');
      });
      return;
    }
    var detailName = t.getAttribute('data-detail-customer');
    if (detailName) { openCustomerDetail(detailName); return; }
    var editName = t.getAttribute('data-edit-customer');
    if (editName) { openEditCustomer(editName); return; }

    var delCust = t.getAttribute('data-delete-customer');
    if (delCust) {
      if (!window.confirm('删除客户「' + delCust + '」？将同时删除其全部跟进、订单和商机，此操作不可恢复。')) return;
      post('/api/crm/customer_delete', { name: delCust }).then(function (r) {
        if (r.s === 200 && r.j.ok) {
          toast('已删除客户（跟进 ' + r.j.deleted_followups + ' / 订单 ' +
                r.j.deleted_orders + ' / 商机 ' + r.j.deleted_opportunities + '）');
          return refreshSnapshot();
        }
        toast((r.j && r.j.error) || '删除失败');
      });
      return;
    }
    var delOrder = t.getAttribute('data-delete-order');
    if (delOrder) {
      if (!window.confirm('删除订单 ' + delOrder + ' ？此操作不可恢复。')) return;
      post('/api/crm/order_delete', { order: delOrder }).then(deleteDone('订单 ' + delOrder));
      return;
    }
    var delOpp = t.getAttribute('data-delete-opp');
    if (delOpp) {
      if (!window.confirm('删除商机「' + delOpp + '」？此操作不可恢复。')) return;
      post('/api/crm/opp_delete', { title: delOpp }).then(deleteDone('商机「' + delOpp + '」'));
      return;
    }
    var delTodo = t.getAttribute('data-delete-todo');
    if (delTodo) {
      if (!window.confirm('删除待办「' + delTodo + '」？')) return;
      post('/api/crm/todo_delete', { title: delTodo }).then(deleteDone('待办「' + delTodo + '」'));
      return;
    }
  });

  /* ---------- 客户搜索 / 筛选（纯前端，重渲染不重新请求） ---------- */
  function bindFilter(id, store, key, evt) {
    var node = document.getElementById(id);
    node.addEventListener(evt, function () {
      store[key] = node.value;
      if (snap) renderSnapshot(snap);
    });
  }
  bindFilter('cuSearch', customerFilter, 'keyword', 'input');
  bindFilter('cuFilterLevel', customerFilter, 'level', 'change');
  bindFilter('cuFilterStatus', customerFilter, 'status', 'change');
  bindFilter('orFilterCategory', orderFilter, 'category', 'change');
  bindFilter('orFilterRegion', orderFilter, 'region', 'change');
  bindFilter('orFilterKw', orderFilter, 'kw', 'input');

  /* ---------- 客户编辑 ---------- */
  function openCustomerDetail(name) {
    var mask = document.getElementById('customerModal');
    var body = document.getElementById('cmBody');
    document.getElementById('cmTitle').textContent = '客户详情';
    body.innerHTML = '<div class="detail-empty">加载中…</div>';
    mask.classList.add('open');
    fetch('/api/crm/customer?name=' + encodeURIComponent(name))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok === false) { body.innerHTML = '<div class="detail-empty">' + esc(d.error || '未找到') + '</div>'; return; }
        document.getElementById('cmTitle').textContent = d.name + ' · ' + d.company;
        body.innerHTML = renderCustomerDetail(d);
      })
      .catch(function (e) { body.innerHTML = '<div class="detail-empty">加载失败：' + esc(String(e)) + '</div>'; });
  }

  function renderCustomerDetail(d) {
    var h = '<div class="detail-summary">' +
      '<span class="chip">订单 <b>' + d.orders.length + '</b> 笔 · ' + money(d.order_total) + '</span>' +
      '<span class="chip">商机 <b>' + d.opportunities.length + '</b> 个 · ' + money(d.open_opportunity_total) + '</span>' +
      '<span class="chip">跟进 <b>' + d.followups.length + '</b> 条</span></div>';
    h += '<div class="detail-grid">' +
      '<div><span class="k">姓名：</span>' + esc(d.name) + '</div>' +
      '<div><span class="k">公司：</span>' + esc(d.company) + '</div>' +
      '<div><span class="k">等级：</span>' + esc(d.level) + '</div>' +
      '<div><span class="k">状态：</span>' + esc(d.status) + '</div>' +
      '<div><span class="k">电话：</span>' + esc(d.phone || '—') + '</div>' +
      '<div><span class="k">负责人：</span>' + esc(d.owner) + '</div>' +
      '<div><span class="k">最近跟进：</span>' + esc(d.last_followup) + '</div></div>';
    h += detailList('跟进记录', d.followups, function (f) {
      return esc(f.created_at) + ' · ' + esc(f.content);
    });
    h += detailList('订单', d.orders, function (o) {
      return esc(o.order) + ' · ' + esc(o.category) + ' · ' + money(o.amount) + ' · ' + esc(o.region);
    });
    h += detailList('商机', d.opportunities, function (o) {
      return esc(o.title) + ' · ' + esc(o.stage) + ' · ' + money(o.amount);
    });
    return h;
  }

  function detailList(heading, rows, fn) {
    var h = '<div class="detail-section"><h4>' + heading + '（' + rows.length + '）</h4>';
    if (!rows.length) { return h + '<div class="detail-empty">暂无</div></div>'; }
    rows.forEach(function (r) { h += '<div>' + fn(r) + '</div>'; });
    return h + '</div>';
  }

  function openEditCustomer(name) {
    if (!snap) return;
    var c = snap.customers.filter(function (x) { return x.name === name; })[0];
    if (!c) return;
    editingCustomer = name;
    document.getElementById('ecName').textContent = '（' + name + '）';
    document.getElementById('ecCompany').value = c.company || '';
    document.getElementById('ecPhone').value = c.phone || '';
    document.getElementById('ecLevel').value = c.level || '普通';
    document.getElementById('ecStatus').value = c.status || '潜在';
    var panel = document.getElementById('editCustomerPanel');
    panel.classList.add('open');
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function closeEditCustomer() {
    editingCustomer = null;
    document.getElementById('editCustomerPanel').classList.remove('open');
  }
  document.getElementById('btnCancelEditCustomer').addEventListener('click', closeEditCustomer);
  document.getElementById('btnSaveCustomer').addEventListener('click', function () {
    if (!editingCustomer) return;
    var payload = {
      name: editingCustomer,
      company: document.getElementById('ecCompany').value.trim(),
      phone: document.getElementById('ecPhone').value.trim(),
      level: document.getElementById('ecLevel').value,
      status: document.getElementById('ecStatus').value
    };
    if (!payload.company) { toast('公司名称不能为空'); return; }
    post('/api/crm/customer_edit', payload).then(function (r) {
      if (r.s === 200 && r.j.ok) {
        toast('已保存客户：' + editingCustomer);
        closeEditCustomer();
        return refreshSnapshot();
      }
      toast((r.j && r.j.error) || ('失败（' + r.s + '）'));
    });
  });

  /* ---------- 订单录入 ---------- */
  document.getElementById('btnAddOrder').addEventListener('click', function () {
    var customer = document.getElementById('orCustomer').value;
    var category = document.getElementById('orCategory').value;
    var amount = document.getElementById('orAmount').value;
    var region = document.getElementById('orRegion').value.trim();
    var product = document.getElementById('orProduct').value.trim();
    if (!customer) { toast('请选择客户'); return; }
    if (!(Number(amount) > 0)) { toast('请输入正确的金额'); return; }
    post('/api/crm/order_create', {
      customer: customer, category: category, amount: amount, region: region, product: product
    }).then(function (r) {
      if (r.s === 200 && r.j.ok) {
        toast('已录入订单 ' + (r.j.order || ''));
        document.getElementById('orAmount').value = '';
        document.getElementById('orRegion').value = '';
        document.getElementById('orProduct').value = '';
        return refreshSnapshot();
      }
      toast((r.j && r.j.error) || ('失败（' + r.s + '）'));
    });
  });

  /* ---------- 商机新建 ---------- */
  document.getElementById('btnAddOpp').addEventListener('click', function () {
    var title = document.getElementById('opTitle').value.trim();
    var customer = document.getElementById('opCustomer').value;
    var amount = document.getElementById('opAmount').value;
    var stage = document.getElementById('opStage').value;
    if (!title) { toast('请填写商机名称'); return; }
    if (!customer) { toast('请选择客户'); return; }
    post('/api/crm/opp_create', {
      title: title, customer: customer, amount: amount === '' ? 0 : amount, stage: stage
    }).then(function (r) {
      if (r.s === 200 && r.j.ok) {
        toast('已新建商机：' + title);
        document.getElementById('opTitle').value = '';
        document.getElementById('opAmount').value = '';
        document.getElementById('opStage').value = '初步接触';
        return refreshSnapshot();
      }
      toast((r.j && r.j.error) || ('失败（' + r.s + '）'));
    });
  });

  /* ---------- 商机阶段推进（看板下拉，change 委托） ---------- */
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    var oppTitle = t.getAttribute('data-opp-stage');
    if (!oppTitle) return;
    var stage = t.value;
    if (!stage) return;
    post('/api/crm/opp_stage', { title: oppTitle, stage: stage }).then(function (r) {
      if (r.s === 200 && r.j.ok) {
        toast('商机「' + oppTitle + '」已推进到 ' + stage);
      } else {
        toast((r.j && r.j.error) || ('失败（' + r.s + '）'));
      }
      return refreshSnapshot();
    });
  });

  /* ---------- 重置 / 抽屉 ---------- */
  document.getElementById('btnReset').addEventListener('click', function () {
    if (!window.confirm('重置演示数据？手动录入的客户、订单、跟进、待办与商机都会清空。')) return;
    post('/api/reset', {}).then(function (r) {
      if (r.s === 200) { toast('演示数据已重置'); return refreshSnapshot(); }
      toast('重置失败：' + JSON.stringify(r.j));
    });
  });
  /* ---------- 原生 CRM 自动同步：跨进程灵动岛或另一标签写入后，网页自动刷新 ---------- */
  function isUserInteracting() {
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return true;
    var edit = document.getElementById('editCustomerPanel');
    if (edit && edit.classList.contains('open')) return true;
    var modal = document.getElementById('customerModal');
    if (modal && modal.classList.contains('open')) return true;
    return false;
  }
  var lastSnapshotHash = '';
  function pollSnapshot() {
    if (isUserInteracting()) return;  // 正在编辑/弹窗打开/输入聚焦时跳过，避免打断
    fetch('/api/snapshot').then(function (r) { return r.json(); }).then(function (s) {
      var h = JSON.stringify(s);
      if (h !== lastSnapshotHash) { lastSnapshotHash = h; renderSnapshot(s); }
    }).catch(function () { /* 轮询静默失败，下一轮再试 */ });
  }
  pollSnapshot();                  // 首次立即渲染
  setInterval(pollSnapshot, 1800); // 之后按数据差异自动同步（灵动岛写入会即时反映）
})();
</script>
</body>
</html>
